# /etc/nginx/sites-available/<DOMAIN> — entregado por el Cloudflare Tunnel (http://localhost:80)
# Sustituir <DOMAIN> por el dominio real y <RUTA_DIST> por la carpeta dist/ del proyecto Astro.
server {
    listen 80;
    listen [::]:80;
    server_name <DOMAIN> www.<DOMAIN>;

    root <RUTA_DIST>;
    index index.html;

    location = /retro-games {
        return 301 /retro-games/;
    }

    # Sección opcional: mini-juegos servidos por un servicio local en :3000
    location /retro-games/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # Reescribe rutas absolutas del HTML/JS al prefijo /retro-games/
        sub_filter 'href="/' 'href="/retro-games/';
        sub_filter 'src="/' 'src="/retro-games/';
        sub_filter 'const API = "/connect-4/api"' 'const API = "/retro-games/connect-4/api"';
        sub_filter_once off;
        sub_filter_types text/html text/css application/javascript text/javascript;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
